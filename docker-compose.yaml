services:
  bot:
    build:
      context: .
      args:
        M1: 'false'
    image: hans:latest
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - line

  postgres:
    container_name: postgres-hans
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hans_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hans -d hans_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - line

  redis:
    container_name: redis
    image: redis/redis-stack-server:6.2.6-v8
    volumes:
      - redis_data:/data
    networks:
      - line

volumes:
  postgres_data:
  redis_data:

networks:
  line:
