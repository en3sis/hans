services:
  # ───────────────────────────────────────────────────────────────
  # Stateful: the Postgres database. Owns the only volume.
  #
  # Port is bound to 127.0.0.1 only — the prod box exposes it to
  # the tailnet via `tailscale serve --tcp 5432 tcp://localhost:5432`.
  # Override POSTGRES_BIND in the host .env if you want a different
  # binding (e.g. the tailnet IP directly).
  # ───────────────────────────────────────────────────────────────
  db:
    container_name: hans-db
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hans}
      POSTGRES_USER: ${POSTGRES_USER:-hans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - '${POSTGRES_BIND:-127.0.0.1}:5432:5432'
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hans} -d ${POSTGRES_DB:-hans}']
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ───────────────────────────────────────────────────────────────
  # Stateless: the Discord bot. Connects to Postgres over the
  # internal docker network. Holds no durable data on disk.
  #
  # Migrations are NOT applied here. They're an admin action run from
  # your laptop over Tailscale — see `yarn db:migrate:remote` and
  # infrastructure/README.md.
  # ───────────────────────────────────────────────────────────────
  bot:
    container_name: hans
    image: ${HANS_IMAGE:-en3sis/hans:nightly}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-hans}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hans}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD', 'node', '-e', "process.env.DATABASE_URL || process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
